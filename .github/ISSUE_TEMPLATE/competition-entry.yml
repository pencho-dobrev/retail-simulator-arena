name: Competition entry
description: Submit a trained agent to the retail-simulator arena.
title: "[Entry] <team> — <agent name>"
labels: ["entry"]
body:
  - type: markdown
    attributes:
      value: |
        Submit **one** trained checkpoint. Attach two files by dragging them into the
        **Checkpoint** field below: your Stable-Baselines3 or sb3-contrib `.zip` (produced
        by `model.save(...)`) and your `entry.json` (the same six fields this form asks for;
        see the README's Submit section). See the README for how the entry is trained,
        self-checked, and scored.
        Final scoring is a tournament among the entries, with no NPCs: entrants are grouped
        into matches of up to six, with seats, home regions and (in larger fields) groups
        rotated across several matches, and ranked by aggregate profit, on an undisclosed
        seed and home rotations. The self-check against the NPC field is local practice only.
  - type: input
    id: team
    attributes:
      label: Team
      description: Your team name, as it should appear in the standings.
    validations:
      required: true
  - type: input
    id: agent_name
    attributes:
      label: Agent name
      description: The name for this checkpoint's seat.
    validations:
      required: true
  - type: dropdown
    id: policy_kind
    attributes:
      label: Policy kind
      description: >-
        The algorithm and policy this zip was trained with. The tooling auto-detects it
        and loads the zip accordingly, but falls back to ppo-mlp without failing when it
        cannot read the zip. That only goes unnoticed for a recurrent-ppo-lstm entry,
        which would then play without its recurrent state — so your declaration is what
        makes the demotion visible.
      options:
        - ppo-mlp
        - a2c-mlp
        - recurrent-ppo-lstm
        - sac
        - td3
        - ddpg
        - tqc
    validations:
      required: true
  - type: input
    id: sb3_version
    attributes:
      label: stable-baselines3 version
      description: >-
        The stable-baselines3 version that saved the zip (the repo pins >=2.3,<3.0). Read it
        from the zip's system_info.txt (the "Stable-Baselines3:" line), e.g.
        `unzip -p model.zip system_info.txt`.
      placeholder: "2.8.0"
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact
      description: How the organizer reaches you about the entry.
    validations:
      required: true
  - type: textarea
    id: training_recipe
    attributes:
      label: Training recipe
      description: >-
        Free text, or paste the contents of the recipe.json that arena_train_player.py
        wrote into your pool directory.
      render: shell
    validations:
      required: false
  - type: textarea
    id: checkpoint
    attributes:
      label: Checkpoint
      description: >-
        Drag-and-drop both files here to attach them: your Stable-Baselines3 or sb3-contrib
        .zip checkpoint and your entry.json.
      placeholder: Attach your model .zip (the same one you self-checked) and your entry.json here.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Before you file it
      description: Confirm each — an entry that fails any of these is not scored.
      options:
        - label: The zip loads and plays a full 1,000-round match against the NPC field without erroring (I ran the self-check).
          required: true
        - label: I declared the correct policy kind above (the auto-detect is silent — a recurrent entry detected as feedforward plays without its recurrent state).
          required: true
        - label: The policy's predict reads nothing but the observation — no network calls, no file reads at decision time.
          required: true
        - label: It is deterministic — the same observation and seed produce the same action.
          required: true
        - label: This is my team's only entry (at most one checkpoint per team).
          required: true
